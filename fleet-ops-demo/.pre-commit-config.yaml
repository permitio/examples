# prek runs these hooks from this folder, on this folder's files. The repository-wide
# hooks (secrets, workflows, shell scripts) live in the root .pre-commit-config.yaml.
repos:
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: sh -c 'test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }'
        language: system
        pass_filenames: false
        types: [go]
      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        pass_filenames: false
        types: [go]
      - id: go-test
        name: go test
        entry: go test ./...
        language: system
        pass_filenames: false
        types: [go]
      - id: opa-test
        name: Custom Rego tests
        entry: opa test --v0-compatible policy/
        language: system
        pass_filenames: false
        files: ^policy/.*\.rego$
