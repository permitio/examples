name: fine-grained-bot-protection

on:
  push:
    branches: [main]
    paths:
      - 'fine-grained-bot-protection/**'
      - '.github/workflows/fine-grained-bot-protection.yaml'
  pull_request:
    paths:
      - 'fine-grained-bot-protection/**'
      - '.github/workflows/fine-grained-bot-protection.yaml'

concurrency:
  # A new push to a PR cancels that PR's superseded run. Pushes to main get a
  # group per commit, so no merge's run is cancelled or replaced while queued.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}
    working-directory: fine-grained-bot-protection

jobs:
  audit:
    name: Locked dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        env:
          npm_config_ignore_scripts: 'true'
        with:
          package_json_file: fine-grained-bot-protection/package.json
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: fine-grained-bot-protection/.nvmrc
          package-manager-cache: false
      - name: Audit the lockfile before installing anything
        run: pnpm audit --audit-level=low

  lint:
    name: Lint and format
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        env:
          npm_config_ignore_scripts: 'true'
        with:
          package_json_file: fine-grained-bot-protection/package.json
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: fine-grained-bot-protection/.nvmrc
          package-manager-cache: false
      - name: Install locked tools without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run oxlint and oxfmt
        run: pnpm lint:oxlint && pnpm lint:format

  types:
    name: Strict types
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        env:
          npm_config_ignore_scripts: 'true'
        with:
          package_json_file: fine-grained-bot-protection/package.json
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: fine-grained-bot-protection/.nvmrc
          package-manager-cache: false
      - name: Install locked tools without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run tsc
        run: pnpm lint:types

  test:
    name: Tests
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        env:
          npm_config_ignore_scripts: 'true'
        with:
          package_json_file: fine-grained-bot-protection/package.json
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: fine-grained-bot-protection/.nvmrc
          package-manager-cache: false
      - name: Install locked tools without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run vitest
        run: pnpm test

  image:
    name: Docker image
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Compose builds the app and setup services from this one Dockerfile.
      - name: Build the image from the Compose file's Dockerfile
        run: docker build --tag fine-grained-bot-protection:ci .
