version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - '*'
  # One entry per example. permitio is vendored from a tarball, which Dependabot leaves alone.
  - package-ecosystem: npm
    versioning-strategy: increase
    directory: /permit-portal-demo
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
    ignore:
      # The demo runs on Node 24, so its Node types stay on 24.x.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      runtime-dependencies:
        dependency-type: production
        update-types: [minor, patch]
        patterns:
          - '*'
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]
        patterns:
          - '*'
  - package-ecosystem: gomod
    directory: /fleet-ops-demo
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      go-dependencies:
        update-types: [minor, patch]
        patterns:
          - '*'
