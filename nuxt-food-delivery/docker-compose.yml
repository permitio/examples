name: nuxt-food-delivery
services:
  # Permit's policy decision point, connected to the environment PERMIT_API_KEY belongs to.
  pdp:
    image: permitio/pdp-v2:0.9.16
    environment:
      PDP_API_KEY: ${PERMIT_API_KEY:?set PERMIT_API_KEY in .env (see .env.example)}
      PDP_CONTROL_PLANE: ${PERMIT_API_URL:-https://api.permit.io}
      PDP_DEBUG: ${PDP_DEBUG:-True}
    # Lets PERMIT_API_URL point at a Permit backend on the host, as http://host.docker.internal:8000.
    extra_hosts: ['host.docker.internal:host-gateway']
    ports: ['${PDP_PORT:-7766}:7000']
    healthcheck:
      # /healthy answers 200 once the PDP has loaded the environment's policy and data.
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:7000/healthy']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  # Creates the policy, the demo users and the demo meals in your Permit environment, then exits.
  # Safe to re-run.
  setup:
    build: .
    command: ['node', 'setup/setup.ts']
    environment:
      PERMIT_API_KEY: ${PERMIT_API_KEY:?set PERMIT_API_KEY in .env (see .env.example)}
      PERMIT_API_URL: ${PERMIT_API_URL:-https://api.permit.io}
    extra_hosts: ['host.docker.internal:host-gateway']
    restart: 'no'

  app:
    build: .
    environment:
      PORT: '3000'
      PERMIT_API_KEY: ${PERMIT_API_KEY:?set PERMIT_API_KEY in .env (see .env.example)}
      PERMIT_API_URL: ${PERMIT_API_URL:-https://api.permit.io}
      PERMIT_PDP_URL: http://pdp:7000
    extra_hosts: ['host.docker.internal:host-gateway']
    ports: ['${APP_PORT:-3000}:3000']
    volumes: ['app-data:/data']
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/customer').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      pdp:
        condition: service_healthy
      setup:
        condition: service_completed_successfully

volumes:
  app-data:
